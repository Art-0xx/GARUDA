services:
  chromadb:
    image: chromadb/chroma:1.0.15
    container_name: garuda-chromadb
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./rag/chroma_data:/data
    environment:
      - IS_PERSISTENT=TRUE
      - PERSIST_DIRECTORY=/data
      - ANONYMIZED_TELEMETRY=FALSE